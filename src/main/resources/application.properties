spring.application.name=interviewmind

# ================================
# 服务端口（与参考项目一致：8080）
# ================================
server.port=8080

# ================================
# PostgreSQL
# 对应 compose.yaml 的 postgres 服务；用环境变量 + 默认值，
# 与参考项目 application.yml 的写法保持一致，便于切换原生安装或远程库。
# ================================
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:interview_guide}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:password}

# ================================
# JPA：只校验 schema，建表与变更交给 Flyway
# 这是参考项目的重要约定：绝不用 ddl-auto=create/update 改表，否则重启会丢数据
# ================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ================================
# Flyway 迁移（脚本放 src/main/resources/db/migration）
# ================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# ================================
# 文件上传上限（知识库 50MB，简历限制在业务层检查）
# ================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ================================
# Docker Compose 生命周期
# start-only：应用退出时不停止容器，Postgres/Redis 保持运行，
# 与参考项目「先手工起依赖容器，再 bootRun」的工作流一致。
# ================================
spring.docker.compose.lifecycle-management=start-only

# ================================
# Spring AI — 只启用 DeepSeek 作为对话模型
#
# 背景：classpath 上同时有 deepseek 和 openai 两个 model starter 时，Spring AI 默认
# 会为每个 provider 各建一个 ChatModel bean（deepSeekChatModel 和 openAiChatModel），
# 而 ChatClientAutoConfiguration 注入 ChatModel 时要求「恰好一个」，
# 于是抛 NoUniqueBeanDefinitionException，chatClientBuilder 创建失败。
#
# Spring AI 2.0 的解法：spring.ai.model.chat 指定「要自动装配哪一个」。
# 不设置 = 每个 provider 都装配；设置后就只装配指定的这个。
# （注意：旧版本教程里的 spring.ai.openai.chat.enabled 在 2.0 已不存在）
#
# 保留 openai 依赖是为了 M2-2：接 Kimi / GLM / 通义等「OpenAI 兼容」Provider 时，
# 需要 OpenAI 的客户端类来手写配置，但那时我们也会关掉它的自动装配。
#
# embedding 到 M5（RAG 知识库）才需要，现在设为 none，避免无用 bean 和缺 key 报错。
#
# ⚠️ 容易踩的坑：spring.ai.model.chat 只控制【对话】模型。
# OpenAI 的 audio / image / moderation 是【各自独立】的自动配置类，各自由
# spring.ai.model.<类型> 控制，并且默认 matchIfMissing=true（不写就启用）。
# 只关 chat 的话，OpenAiAudioSpeechAutoConfiguration 仍会尝试建 bean，
# 然后因为「没有 openai api-key」导致启动失败：
#   At least one credential source must be specified: credential (apiKey), ...
# 所以必须把不用的类型逐个关掉。
# ================================
spring.ai.model.chat=deepseek
spring.ai.model.embedding=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.image=none
spring.ai.model.moderation=none

# DeepSeek 的 key 从环境变量注入，绝不写进本文件（本文件会提交进 Git）。
# 设置方式（PowerShell）：$env:DEEPSEEK_API_KEY = "sk-xxx"
spring.ai.deepseek.api-key=${DEEPSEEK_API_KEY}
# ================================
# 多 Provider 配置（M2-2）
# 用一张表描述所有可用的大模型；providers 后面那一级就是 provider id
# ================================
app.ai.default-provider=deepseek

app.ai.providers.deepseek.base-url=https://api.deepseek.com
app.ai.providers.deepseek.api-key=${DEEPSEEK_API_KEY}
app.ai.providers.deepseek.model=deepseek-chat
app.ai.providers.deepseek.temperature=0.7

# 第二个 Provider：用来证明 Map 能绑定多个 key。
# 没有 MOONSHOT_API_KEY 时 api-key 是空字符串，M2-2-2 建客户端时会跳过它。
app.ai.providers.kimi.base-url=https://api.moonshot.cn/v1
app.ai.providers.kimi.api-key=${MOONSHOT_API_KEY:}
app.ai.providers.kimi.model=moonshot-v1-8k
# ================================
# SpringDoc / Swagger UI
# ================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
# ================================
# 简历上传
# ================================
# 单个文件最大字节数（10MB）
app.resume.max-size=10485760
# 允许的扩展名，逗号分隔（Spring Boot 会自动转成 List<String>）
app.resume.allowed-extensions=pdf,doc,docx,txt