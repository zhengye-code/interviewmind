# Test profile: run against an in-memory H2 database so that `mvn test` / `mvn package`
# succeeds without Docker or a running PostgreSQL instance.
#
# The application itself gets its datasource from Docker Compose (see compose.yaml),
# but Spring Boot skips the Docker Compose lifecycle in tests by default
# (spring.docker.compose.skip.in-tests=true), so tests must be self-contained.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Migrations target PostgreSQL（IDENTITY / TEXT / CHECK 等）与 H2 不完全兼容，
# 测试关闭 Flyway，改由 Hibernate 依据实体反向建表。
# 注意：主配置里 ddl-auto=validate，若不覆盖，H2 空库 + validate 会导致
# 「Schema validation: missing table」——测试从第一个实体加入起就会失败。
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop

# 测试期不启动 Redis Stream 消费者，避免单元测试连接真实 Redis、产生后台线程
app.async.resume-analyze.enabled=false

# The DeepSeek chat model starter asserts that a key is present while building the
# bean. This is a placeholder for tests only - the bean is never invoked, and the
# real key is supplied by the environment at runtime.
#
# 注意：这里【不再】给 spring.ai.openai 配置占位 key。
# 之前那行 spring.ai.openai.api-key=test-api-key 会让 OpenAI 的 audio/image 等
# 自动配置在测试期成功建 bean，从而掩盖「运行时没有 key 就启动失败」的问题。
# 测试环境应当和运行时面对同样的条件，问题才能被测试提前发现。
spring.ai.deepseek.api-key=test-api-key
spring.ai.model.embedding=none
spring.autoconfigure.exclude=org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration
# M0 已移除脚手架的 Azure AI Search 向量库依赖，上面的 azure 占位配置随之删除。
# M5 引入 pgvector 时，需要在此补充 spring.ai.vectorstore.pgvector.* 的测试配置
# （关键是 initialize-schema=false，避免测试期真的去建向量表）。
