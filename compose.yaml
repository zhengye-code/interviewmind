# 本地开发依赖服务 —— 对照参考项目 docker-compose.dev.yml
# 用法：docker compose up -d
# 停止：docker compose down
# 清数据：docker compose down -v
#
# 注意：Spring Boot 的 spring-boot-docker-compose 会在应用启动时自动执行
# `docker compose up`，并把 postgres / redis 的连接信息注入 DataSource 与 Redis 配置。
# 因此本文件必须叫 compose.yaml（Boot 的默认查找名）。

services:
  postgres:
    # 必须是 pgvector 镜像：参考项目的向量检索依赖 pgvector 扩展，官方 postgres 镜像没有
    image: pgvector/pgvector:pg16
    container_name: interviewmind-postgres
    environment:
      POSTGRES_DB: interview_guide
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d interview_guide"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: interviewmind-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3 兼容对象存储：M3（简历上传）才会真正用到
  # 参考项目开发环境用 RustFS，此处用 MinIO —— 同为 S3 协议，Windows 下更省事（无需 RPC secret）
  minio:
    image: minio/minio:latest
    container_name: interviewmind-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  createbuckets:
    image: minio/mc:latest
    container_name: interviewmind-createbuckets
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/interview-guide &&
      echo 'bucket interview-guide ready'
      "

volumes:
  postgres_data:
  redis_data:
  minio_data:
