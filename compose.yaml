# 本地开发依赖服务 —— 对照参考项目 docker-compose.dev.yml
# 用法：docker compose up -d
# 停止：docker compose down
# 清数据：docker compose down -v
#
# 注意：Spring Boot 的 spring-boot-docker-compose 会在应用启动时自动执行
# `docker compose up`，并把 postgres / redis 的连接信息注入 DataSource 与 Redis 配置。
# 因此本文件必须叫 compose.yaml（Boot 的默认查找名）。

services:
  postgres:
    # 必须是 pgvector 镜像：参考项目的向量检索依赖 pgvector 扩展，官方 postgres 镜像没有
    image: pgvector/pgvector:pg16
    container_name: interviewmind-postgres
    environment:
      POSTGRES_DB: interview_guide
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # 仅在数据卷首次初始化时执行；用于自动创建 pgvector 扩展
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d interview_guide"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: interviewmind-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3 兼容对象存储：M3（简历上传）才会真正用到。
  # 用参考项目同款的 RustFS。
  # 说明：2025-10 MinIO 删除了全部 Docker Hub 镜像并停掉开源社区版，
  # 所以这里不采用 MinIO（参见 https://www.appinn.com/minio-remove-docker-images/）。
  rustfs:
    image: rustfs/rustfs:1.0.0-rc.6
    container_name: interviewmind-rustfs
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      # 参考项目要求从 .env 注入；这里给默认值，避免没有 .env 时 compose 直接报错
      RUSTFS_RPC_SECRET: ${RUSTFS_RPC_SECRET:-rustfsadmin}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "/usr/bin/curl", "--fail", "--silent", "http://localhost:9000/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
  redis_data:
  rustfs_data:
